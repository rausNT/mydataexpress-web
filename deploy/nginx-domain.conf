server {
    listen 80;
    listen [::]:80;
    server_name dx.74-208-142-118.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dx.74-208-142-118.sslip.io;
    access_log /var/log/nginx/dataexpress-access.log dataexpress_json;
    error_log /var/log/nginx/dataexpress-error.log warn;

    ssl_certificate /etc/letsencrypt/live/dx.74-208-142-118.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dx.74-208-142-118.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DXTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 256m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    keepalive_timeout 20s;
    send_timeout 60s;
    reset_timedout_connection on;
    limit_conn dx_connections 30;
    limit_req zone=dx_requests burst=80 nodelay;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Request-ID $request_id always;

    location = /robots.txt {
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location ~ /\.(?!well-known(?:/|$)) {
        access_log off;
        return 404;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        limit_conn dx_connections 3;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    include /etc/nginx/snippets/dataexpress-worker-routes.conf;

    location / {
        limit_req zone=dx_requests burst=80 nodelay;
        limit_req zone=dx_logins burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }
}
