name: Web modernization checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript-and-extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Test Windows worker configuration generator
        run: python3 -m unittest discover -s deploy/windows-worker -p 'test_*.py'
      - name: Validate Linux one-line installer syntax
        run: |
          bash -n deploy/install.sh
          bash -n deploy/install-windows-worker.sh
          bash -n deploy/windows-worker/reconfigure.sh
      - name: Install headless LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc
      - name: Smoke-test real Word and Calc conversion
        run: npm run smoke:office-provider
      - run: npm run audit:fixtures > extension-compatibility.json
      - uses: actions/upload-artifact@v4
        with:
          name: extension-compatibility
          path: extension-compatibility.json

  linux-pascal-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dxbit/dataexpress-depend
          path: dependencies/dataexpress-depend
      - name: Install Free Pascal and headless Lazarus units
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fp-compiler fp-units-base fp-units-db fp-units-fcl \
            fp-units-misc fp-units-net lazarus-src lcl-nogui lcl-units
      - name: Build Linux amd64 server
        run: |
          lazarus_dir="$(find /usr/lib/lazarus -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          dependencies="$PWD/dependencies/dataexpress-depend"
          mkdir -p _linux-bin lib/x86_64-linux
          fpc -B -MObjFPC -Scghi -CX -O1 -g -gl -vewnhibq \
            -dUseCThreads -dBGRABITMAP_DONT_USE_LCL \
            -Fu. \
            -Fu"$lazarus_dir/lcl/units/x86_64-linux/nogui" \
            -Fu"$lazarus_dir/lcl/units/x86_64-linux" \
            -Fu"$lazarus_dir/components/lazutils" \
            -Fu"$lazarus_dir/components/freetype" \
            -Fu"$dependencies/PascalScript/Source" \
            -Fu"$dependencies/bgra/bgrabitmap" \
            -Fi. -FE_linux-bin -FUlib/x86_64-linux dxwebsrv.pas
          strip _linux-bin/dxwebsrv
      - uses: actions/upload-artifact@v4
        with:
          name: dataexpress-linux-amd64
          path: _linux-bin/dxwebsrv
          retention-days: 14
          if-no-files-found: error

  windows-pascal-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dxbit/dataexpress-depend
          path: dependencies/dataexpress-depend
      - name: Install Lazarus 4.6 and FPC 3.2.2
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'lazarus-4.6-fpc-3.2.2-win32.exe'
          $lazarusRoot = Join-Path $env:RUNNER_TEMP 'lazarus'
          $downloadUrl = 'https://download.lazarus-ide.org/Lazarus%20Windows%2032%20bits/Lazarus%204.6/lazarus-4.6-fpc-3.2.2-win32.exe'
          $expectedMd5 = 'B9728418A8FEBD934057861DF8550CFA'

          Invoke-WebRequest -Uri $downloadUrl -OutFile $installer
          $actualMd5 = (Get-FileHash -LiteralPath $installer -Algorithm MD5).Hash
          if ($actualMd5 -ne $expectedMd5) {
            throw "Lazarus installer checksum mismatch: $actualMd5"
          }

          $process = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            "/DIR=$lazarusRoot"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Lazarus installer failed with exit code $($process.ExitCode)"
          }
      - name: Build Win32 server
        shell: pwsh
        run: |
          $lazarusRoot = Join-Path $env:RUNNER_TEMP 'lazarus'
          $lazarusConfig = Join-Path $env:RUNNER_TEMP 'lazarus-config'
          ./tools/build-windows.ps1 `
            -LazarusRoot $lazarusRoot `
            -ComponentsRoot (Join-Path $PWD 'dependencies/dataexpress-depend') `
            -PrimaryConfigPath $lazarusConfig
      - name: Smoke-test generated .wepas and Pascal provider bridge
        shell: pwsh
        run: |
          $lazarusRoot = Join-Path $env:RUNNER_TEMP 'lazarus'
          $componentsRoot = Join-Path $PWD 'dependencies/dataexpress-depend'
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'provider-smoke'
          $smokeUnits = Join-Path $smokeRoot 'units'
          New-Item -ItemType Directory -Path $smokeRoot, $smokeUnits | Out-Null

          $fpc = Join-Path $lazarusRoot 'fpc/3.2.2/bin/i386-win32/fpc.exe'
          $fpcArguments = @(
            "-Fu$(Join-Path $PWD 'lib/i386-win32')",
            "-Fu$(Join-Path $lazarusRoot 'components/lazutils/lib/i386-win32')",
            "-Fu$(Join-Path $lazarusRoot 'components/freetype/lib/i386-win32')",
            "-Fu$(Join-Path $lazarusRoot 'packager/units/i386-win32')",
            "-Fu$(Join-Path $componentsRoot 'PascalScript/Source/lib/i386-win32')",
            "-Fu$(Join-Path $componentsRoot 'bgra/bgrabitmap/lib4nogui/i386-win32/3.2.2')",
            "-FE$smokeRoot",
            "-FU$smokeUnits",
            (Join-Path $PWD 'tools/provider-smoke.pas')
          )
          & $fpc @fpcArguments
          if ($LASTEXITCODE -ne 0) { throw "Provider smoke compilation failed: $LASTEXITCODE" }

          $migrationInput = Join-Path $env:RUNNER_TEMP 'extension-source'
          $migrationRoot = Join-Path $env:RUNNER_TEMP 'extension-migration'
          $providerMigrationRoot = Join-Path $env:RUNNER_TEMP 'extension-provider-migration'
          $mixedInput = Join-Path $env:RUNNER_TEMP 'extension-mixed-source'
          $mixedMigrationRoot = Join-Path $env:RUNNER_TEMP 'extension-mixed-migration'
          $runtimeInput = Join-Path $env:RUNNER_TEMP 'extension-runtime-source'
          $runtimeMigrationRoot = Join-Path $env:RUNNER_TEMP 'extension-runtime-migration'
          $httpInput = Join-Path $env:RUNNER_TEMP 'extension-http-source'
          $httpMigrationRoot = Join-Path $env:RUNNER_TEMP 'extension-http-migration'
          $httpRequestInput = Join-Path $env:RUNNER_TEMP 'extension-http-request-source'
          $httpRequestMigrationRoot = Join-Path $env:RUNNER_TEMP 'extension-http-request-migration'
          $dadataInput = Join-Path $env:RUNNER_TEMP 'extension-dadata-source'
          $dadataMigrationRoot = Join-Path $env:RUNNER_TEMP 'extension-dadata-migration'
          $officeInput = Join-Path $env:RUNNER_TEMP 'extension-office-source'
          $officeMigrationRoot = Join-Path $env:RUNNER_TEMP 'extension-office-migration'
          New-Item -ItemType Directory -Path $migrationInput | Out-Null
          New-Item -ItemType Directory -Path $mixedInput | Out-Null
          New-Item -ItemType Directory -Path $runtimeInput | Out-Null
          New-Item -ItemType Directory -Path $httpInput | Out-Null
          New-Item -ItemType Directory -Path $httpRequestInput | Out-Null
          New-Item -ItemType Directory -Path $dadataInput | Out-Null
          New-Item -ItemType Directory -Path $officeInput | Out-Null
          $desktopModule = Join-Path $migrationInput 'portable.epas'
          Copy-Item -LiteralPath (Join-Path $PWD 'test/fixtures/extensions/portable.epas') `
            -Destination $desktopModule
          Copy-Item -LiteralPath (Join-Path $PWD 'test/fixtures/extensions/mixed.epas') `
            -Destination (Join-Path $mixedInput 'mixed.epas')
          Copy-Item -LiteralPath (Join-Path $PWD 'test/fixtures/extensions/runtime-api.epas') `
            -Destination (Join-Path $runtimeInput 'runtime-api.epas')
          Copy-Item -LiteralPath (Join-Path $PWD 'test/fixtures/extensions/legacy-http-get.epas') `
            -Destination (Join-Path $httpInput 'legacy-http-get.epas')
          Copy-Item -LiteralPath (Join-Path $PWD 'test/fixtures/extensions/legacy-http-request.epas') `
            -Destination (Join-Path $httpRequestInput 'legacy-http-request.epas')
          Copy-Item -LiteralPath (Join-Path $PWD 'test/fixtures/extensions/legacy-dadata.epas') `
            -Destination (Join-Path $dadataInput 'legacy-dadata.epas')
          Copy-Item -LiteralPath (Join-Path $PWD 'test/fixtures/extensions/legacy-office.epas') `
            -Destination (Join-Path $officeInput 'legacy-office.epas')
          & (Get-Command node).Source (Join-Path $PWD 'tools/extension-batch-migrate.mjs') `
            $migrationInput --output-dir $migrationRoot
          if ($LASTEXITCODE -ne 0) { throw "Batch extension migration failed: $LASTEXITCODE" }
          & (Get-Command node).Source (Join-Path $PWD 'tools/extension-batch-migrate.mjs') `
            $migrationInput --output-dir $providerMigrationRoot --all-providers
          if ($LASTEXITCODE -ne 0) { throw "Forced provider migration failed: $LASTEXITCODE" }
          & (Get-Command node).Source (Join-Path $PWD 'tools/extension-batch-migrate.mjs') `
            $mixedInput --output-dir $mixedMigrationRoot
          if ($LASTEXITCODE -ne 0) { throw "Mixed extension migration failed: $LASTEXITCODE" }
          & (Get-Command node).Source (Join-Path $PWD 'tools/extension-batch-migrate.mjs') `
            $runtimeInput --output-dir $runtimeMigrationRoot --strict
          if ($LASTEXITCODE -ne 0) { throw "Runtime API extension migration failed: $LASTEXITCODE" }
          & (Get-Command node).Source (Join-Path $PWD 'tools/extension-batch-migrate.mjs') `
            $httpInput --output-dir $httpMigrationRoot --strict
          if ($LASTEXITCODE -ne 0) { throw "HTTP recipe extension migration failed: $LASTEXITCODE" }
          & (Get-Command node).Source (Join-Path $PWD 'tools/extension-batch-migrate.mjs') `
            $httpRequestInput --output-dir $httpRequestMigrationRoot --strict
          if ($LASTEXITCODE -ne 0) { throw "HTTP request extension migration failed: $LASTEXITCODE" }
          & (Get-Command node).Source (Join-Path $PWD 'tools/extension-batch-migrate.mjs') `
            $dadataInput --output-dir $dadataMigrationRoot --strict
          if ($LASTEXITCODE -ne 0) { throw "DaData recipe extension migration failed: $LASTEXITCODE" }
          & (Get-Command node).Source (Join-Path $PWD 'tools/extension-batch-migrate.mjs') `
            $officeInput --output-dir $officeMigrationRoot --strict
          if ($LASTEXITCODE -ne 0) { throw "Office recipe extension migration failed: $LASTEXITCODE" }

          $wepasArguments = @(
            "-Fu$(Join-Path $PWD 'lib/i386-win32')",
            "-Fu$(Join-Path $lazarusRoot 'components/lazutils/lib/i386-win32')",
            "-Fu$(Join-Path $lazarusRoot 'components/freetype/lib/i386-win32')",
            "-Fu$(Join-Path $lazarusRoot 'packager/units/i386-win32')",
            "-Fu$(Join-Path $componentsRoot 'PascalScript/Source/lib/i386-win32')",
            "-Fu$(Join-Path $componentsRoot 'bgra/bgrabitmap/lib4nogui/i386-win32/3.2.2')",
            "-FE$smokeRoot",
            "-FU$smokeUnits",
            (Join-Path $PWD 'tools/wepas-compile-smoke.pas')
          )
          & $fpc @wepasArguments
          if ($LASTEXITCODE -ne 0) { throw "Wepas smoke compilation failed: $LASTEXITCODE" }
          $syntaxArguments = @(
            "-Fu$(Join-Path $PWD 'lib/i386-win32')",
            "-Fu$(Join-Path $lazarusRoot 'components/lazutils/lib/i386-win32')",
            "-Fu$(Join-Path $lazarusRoot 'components/freetype/lib/i386-win32')",
            "-Fu$(Join-Path $lazarusRoot 'packager/units/i386-win32')",
            "-Fu$(Join-Path $componentsRoot 'PascalScript/Source/lib/i386-win32')",
            "-Fu$(Join-Path $componentsRoot 'bgra/bgrabitmap/lib4nogui/i386-win32/3.2.2')",
            "-FE$smokeRoot",
            "-FU$smokeUnits",
            (Join-Path $PWD 'tools/wepas-syntax-smoke.pas')
          )
          & $fpc @syntaxArguments
          if ($LASTEXITCODE -ne 0) { throw "Wepas syntax smoke compilation failed: $LASTEXITCODE" }
          & (Join-Path $smokeRoot 'wepas-compile-smoke.exe') `
            (Join-Path $migrationRoot 'portable.epas') `
            (Join-Path $migrationRoot 'portable.wepas') web-script
          if ($LASTEXITCODE -ne 0) { throw "Inline wepas compilation failed: $LASTEXITCODE" }
          & (Join-Path $smokeRoot 'wepas-compile-smoke.exe') `
            (Join-Path $providerMigrationRoot 'portable.epas') `
            (Join-Path $providerMigrationRoot 'portable.wepas') provider
          if ($LASTEXITCODE -ne 0) { throw "Provider wepas compilation failed: $LASTEXITCODE" }
          & (Join-Path $smokeRoot 'wepas-compile-smoke.exe') `
            (Join-Path $mixedMigrationRoot 'mixed.epas') `
            (Join-Path $mixedMigrationRoot 'mixed.wepas') mixed
          if ($LASTEXITCODE -ne 0) { throw "Mixed wepas compilation failed: $LASTEXITCODE" }
          & (Join-Path $smokeRoot 'wepas-syntax-smoke.exe') `
            (Join-Path $runtimeMigrationRoot 'runtime-api.wepas')
          if ($LASTEXITCODE -ne 0) { throw "Runtime API wepas compilation failed: $LASTEXITCODE" }
          & (Join-Path $smokeRoot 'wepas-syntax-smoke.exe') `
            (Join-Path $httpMigrationRoot 'legacy-http-get.wepas')
          if ($LASTEXITCODE -ne 0) { throw "HTTP recipe wepas compilation failed: $LASTEXITCODE" }
          & (Join-Path $smokeRoot 'wepas-syntax-smoke.exe') `
            (Join-Path $httpRequestMigrationRoot 'legacy-http-request.wepas')
          if ($LASTEXITCODE -ne 0) { throw "HTTP request wepas compilation failed: $LASTEXITCODE" }
          & (Join-Path $smokeRoot 'wepas-syntax-smoke.exe') `
            (Join-Path $dadataMigrationRoot 'legacy-dadata.wepas')
          if ($LASTEXITCODE -ne 0) { throw "DaData recipe wepas compilation failed: $LASTEXITCODE" }
          & (Join-Path $smokeRoot 'wepas-syntax-smoke.exe') `
            (Join-Path $officeMigrationRoot 'legacy-office.wepas')
          if ($LASTEXITCODE -ne 0) { throw "Office recipe wepas compilation failed: $LASTEXITCODE" }
          & (Join-Path $smokeRoot 'wepas-syntax-smoke.exe') `
            (Join-Path $PWD 'deploy/shared-extensions/DX_PLUS_WEB-compat-1.8.1.wepas')
          if ($LASTEXITCODE -ne 0) { throw "DX_PLUS compatibility module compilation failed: $LASTEXITCODE" }
          & (Join-Path $smokeRoot 'wepas-syntax-smoke.exe') `
            (Join-Path $PWD 'deploy/database-extensions/CAFETERIA/kok80-ExportToExcel4.0b1.wepas')
          if ($LASTEXITCODE -ne 0) { throw "kok80 Excel compatibility module compilation failed: $LASTEXITCODE" }

          $token = 'provider-smoke-secret'
          $port = 19081
          $providerOut = Join-Path $smokeRoot 'provider.stdout.log'
          $providerErr = Join-Path $smokeRoot 'provider.stderr.log'
          $provider = Start-Process -FilePath (Get-Command node).Source `
            -ArgumentList @((Join-Path $PWD 'tools/provider-smoke-server.mjs'), $port, $token) `
            -WorkingDirectory $PWD -WindowStyle Hidden -PassThru `
            -RedirectStandardOutput $providerOut -RedirectStandardError $providerErr
          try {
            $deadline = (Get-Date).AddSeconds(15)
            do {
              $listener = Get-NetTCPConnection -LocalAddress 127.0.0.1 `
                -LocalPort $port -State Listen -ErrorAction SilentlyContinue
              if ($listener) { break }
              if ($provider.HasExited) { throw 'Provider smoke server exited early' }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            if (-not $listener) { throw 'Provider smoke server did not start' }

            & (Join-Path $smokeRoot 'provider-smoke.exe') `
              "http://127.0.0.1:$port/" $token
            if ($LASTEXITCODE -ne 0) {
              if (Test-Path -LiteralPath $providerOut) { Get-Content -LiteralPath $providerOut }
              if (Test-Path -LiteralPath $providerErr) { Get-Content -LiteralPath $providerErr }
              throw "Provider smoke test failed: $LASTEXITCODE"
            }
          }
          finally {
            if (-not $provider.HasExited) { Stop-Process -Id $provider.Id }
          }
      - name: Smoke-test Win32 server process
        shell: pwsh
        run: |
          $config = Join-Path $PWD '_test/dxwebsrv.cfg'
          @'
          [Server]
          Language=ru
          Address=127.0.0.1
          Port=19082
          UseSSL=False
          Firebird=5
          DebugMode=False
          ShowConnections=False
          WindowsWorkerMode=True
          '@ | Set-Content -LiteralPath $config -Encoding UTF8

          $stdout = Join-Path $env:RUNNER_TEMP 'dxwebsrv.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'dxwebsrv.stderr.log'
          $server = Start-Process -FilePath (Join-Path $PWD '_test/dxwebsrv.exe') `
            -WorkingDirectory (Join-Path $PWD '_test') -WindowStyle Hidden -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $deadline = (Get-Date).AddSeconds(20)
            do {
              if ($server.HasExited) {
                Get-Content -LiteralPath $stdout, $stderr -ErrorAction SilentlyContinue
                throw "Win32 server exited early with code $($server.ExitCode)"
              }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:19082/health' `
                  -TimeoutSec 2
              }
              catch {
                $health = $null
                Start-Sleep -Milliseconds 250
              }
            } while (($null -eq $health) -and ((Get-Date) -lt $deadline))
            if (($null -eq $health) -or ($health.status -ne 'ok')) {
              Get-Content -LiteralPath $stdout, $stderr -ErrorAction SilentlyContinue
              throw 'Win32 server health check failed'
            }
          }
          finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: Package Wine compatibility worker
        shell: pwsh
        run: |
          $packageRoot = Join-Path $PWD '_dist/wine-worker'
          New-Item -ItemType Directory -Path $packageRoot | Out-Null
          Copy-Item -LiteralPath (Join-Path $PWD '_test/dxwebsrv.exe') -Destination $packageRoot
          foreach ($directory in @('html', 'img', 'languages', 'templates', 'fb5')) {
            Copy-Item -Recurse -LiteralPath (Join-Path $PWD "_test/$directory") `
              -Destination (Join-Path $packageRoot $directory)
          }
          Copy-Item -Recurse -LiteralPath (Join-Path $PWD 'deploy/windows-worker') `
            -Destination (Join-Path $packageRoot 'worker-tools')
          foreach ($file in @(
            'Except.dic',
            'favicon.ico',
            'firebird.msg',
            'ib_util.dll',
            'LICENSE.txt',
            'NOTICE.txt',
            'PadegUC.dll',
            'msvcp140.dll',
            'vcruntime140.dll'
          )) {
            Copy-Item -LiteralPath (Join-Path $PWD "_test/$file") -Destination $packageRoot
          }
          Compress-Archive -Path (Join-Path $packageRoot '*') `
            -DestinationPath (Join-Path $PWD '_dist/dxwebsrv-wine-worker.zip')
      - uses: actions/upload-artifact@v4
        with:
          name: dxwebsrv-win32
          path: |
            _test/dxwebsrv.exe
            _dist/dxwebsrv-wine-worker.zip
