name: Web modernization checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript-and-extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run audit:fixtures > extension-compatibility.json
      - uses: actions/upload-artifact@v4
        with:
          name: extension-compatibility
          path: extension-compatibility.json
